<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Not black-translucent: on the home screen that anchors the viewport
     at the top of the display while sizing it to the screen MINUS the
     status bar, stranding an equal dead band along the bottom that no
     amount of styling can reach. Plain black starts the viewport below
     the status bar and it reaches the foot of the screen. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="disabled-adaptations" content="watch">
<meta name="theme-color" content="#131518">
<title>Scoreboard</title>
<style>
  :root{
    --bg:#131518;
    --left:#1B4FD8;
    --right:#C8232F;
    --ink:#FFFFFF;
    --hold:700ms;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    position:fixed;
    inset:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* Stage holds the safe-area inset and never rotates. */
  #stage{
    position:absolute;
    inset:0;
    padding:
      calc(6px + env(safe-area-inset-top))
      calc(6px + env(safe-area-inset-right))
      calc(6px + env(safe-area-inset-bottom))
      calc(6px + env(safe-area-inset-left));
  }

  /* Board rotates as a whole so the digits are always upright in the
     real world. Size and transform are set from JS. */
  #board{
    position:absolute;
    display:flex;
    flex-direction:column;
    transform-origin:0 0;
    transition:transform 260ms cubic-bezier(.4,0,.2,1);
  }

  #panels{
    flex:1;
    min-height:0;
    min-width:0;
    display:flex;
    gap:6px;
  }

  /* Turning the handset over 180 degrees leaves the coloured panels on
     exactly the same glass and rotates only the digits. That holds on
     both axes: up/down are a pair, and right/left are a pair. Swapping
     which of right/left carries the reverse mirrors the sideways case. */
  #board[data-pose="up"]    #panels,
  #board[data-pose="right"] #panels{flex-direction:row}
  #board[data-pose="down"]  #panels,
  #board[data-pose="left"]  #panels{flex-direction:row-reverse}

  .panel{
    flex:1;
    position:relative;
    border-radius:22px;
    display:grid;
    place-items:center;
    touch-action:none;
    overflow:hidden;
    container-type:size;
  }
  .panel[data-side="left"]{background:var(--left)}
  .panel[data-side="right"]{background:var(--right)}

  .score{
    font-size:min(32vw,32vh);          /* fallback */
    font-weight:700;
    line-height:1;
    letter-spacing:-0.045em;
    font-variant-numeric:tabular-nums;
    display:block;
    will-change:transform;
  }
  @supports (container-type:size){
    .score{font-size:min(76cqw,90cqh)}
  }
  .score.bump{animation:pop 180ms ease-out}
  @keyframes pop{
    0%{transform:scale(1)}
    45%{transform:scale(1.14)}
    100%{transform:scale(1)}
  }

  .cue{
    position:absolute;
    left:0;right:0;
    text-align:center;
    font-size:15px;
    opacity:.22;
    pointer-events:none;
  }
  .cue.up{top:14px}
  .cue.down{bottom:14px}

  /* Floats over the foot of the panels, which keeps the full height of
     the board for the rectangles. Inside the board, so it turns with
     everything else and stays upright. */
  #controls{
    position:absolute;
    left:50%;
    bottom:6px;
    transform:translateX(-50%);
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }

  button{
    border:none;
    background:var(--bg);
    color:rgba(255,255,255,.55);
    box-shadow:0 0 0 1px rgba(255,255,255,.18);
    font-family:inherit;
    touch-action:none;
    cursor:pointer;
  }

  #reset{
    position:relative;
    width:46px;height:46px;
    display:grid;
    place-items:center;
    border-radius:50%;
    transition:transform 120ms ease-out,color 120ms ease-out;
  }
  #reset.holding{transform:scale(.88);color:#fff}
  #reset svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  #reset .prog{
    fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;
    stroke-dasharray:126;stroke-dashoffset:126;
  }
  #reset.holding .prog{
    stroke-dashoffset:0;
    transition:stroke-dashoffset var(--hold) linear;
  }
  #reset .glyph{font-size:19px;line-height:1;position:relative}

  #flip{
    height:34px;
    padding:0 14px;
    border-radius:17px;
    font-size:13px;
    font-weight:600;
  }
  #flip[hidden]{display:none}

  #dbg{
    position:absolute;
    top:10px;left:12px;
    font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:rgba(255,255,255,.8);
    background:rgba(0,0,0,.55);
    padding:6px 8px;
    border-radius:8px;
    white-space:pre;
    pointer-events:none;
  }
  #dbg[hidden]{display:none}

  /* On the home screen there is no address bar, so no reason to hold
     room for one. Panels run to the edges; only the reset button keeps
     clear of the home indicator. */
  @media (display-mode: standalone){
    #stage{padding:4px}
    #controls{bottom:calc(6px + env(safe-area-inset-bottom))}
  }
  html.standalone #stage{padding:4px}
  html.standalone #controls{bottom:calc(6px + env(safe-area-inset-bottom))}

  /* Watch-sized screens. Both dimensions are tested so no phone matches. */
  @media (max-width: 300px) and (max-height: 300px){
    #stage{
      padding:
        calc(3px + env(safe-area-inset-top))
        calc(3px + env(safe-area-inset-right))
        calc(3px + env(safe-area-inset-bottom))
        calc(3px + env(safe-area-inset-left));
    }
    #panels{gap:4px}
    .panel{border-radius:14px}
    .cue{font-size:10px}
    .cue.up{top:6px}
    .cue.down{bottom:6px}
    #controls{bottom:2px;gap:6px}
    #reset{width:28px;height:28px}
    #reset .glyph{font-size:13px}
    #flip{height:22px;padding:0 9px;font-size:10px;border-radius:11px}
    #dbg{font-size:9px;padding:4px 5px}
  }

  @media (prefers-reduced-motion: reduce){
    .score.bump{animation:none}
    #board,#reset,#reset.holding .prog{transition:none}
  }
</style>
</head>
<body>

<div id="stage">
  <main id="board" data-pose="up">
   <div id="panels">
    <section class="panel" data-side="left">
      <span class="cue up">&#9650;</span>
      <span class="score" id="score-left">0</span>
      <span class="cue down">&#9660;</span>
    </section>
    <section class="panel" data-side="right">
      <span class="cue up">&#9650;</span>
      <span class="score" id="score-right">0</span>
      <span class="cue down">&#9660;</span>
    </section>
   </div>

    <div id="controls">
      <button id="flip">Auto-flip</button>
      <button id="reset" aria-label="Hold to reset both scores">
        <svg viewBox="0 0 46 46" aria-hidden="true">
          <circle class="prog" cx="23" cy="23" r="20"></circle>
        </svg>
        <span class="glyph" aria-hidden="true">&#8635;</span>
      </button>
    </div>

    <div id="dbg" hidden></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  var MAX = 99, MIN = 0, SWIPE = 24, HOLD = 700;

  // Older iOS predates the display-mode media query.
  if (window.navigator.standalone === true){
    document.documentElement.classList.add("standalone");
  }

  var stage   = document.getElementById("stage");
  var board   = document.getElementById("board");
  var flipBtn = document.getElementById("flip");
  var scores  = { left: 0, right: 0 };
  var el = {
    left:  document.getElementById("score-left"),
    right: document.getElementById("score-right")
  };

  // Pose is where the handset physically is, from gravity alone.
  var POSE = { up:0, right:90, down:180, left:270 };
  var pose = "up";
  var sensorLive = false;
  var manualDown = false;
  var R = 0;                       // degrees the board is rotated in the viewport

  var DEBUG = location.hash.indexOf("debug") >= 0;
  var dbg = document.getElementById("dbg");
  var last = { beta:null, gamma:null, theta:null };
  var dbgAt = 0;

  function updateDebug(){
    if (!DEBUG) return;
    dbg.hidden = false;
    dbg.textContent =
      "pose " + currentPose() + "   R " + R + "\n" +
      "theta " + (last.theta === null ? "-" : Math.round(last.theta)) +
      "   b " + (last.beta === null ? "-" : Math.round(last.beta)) +
      "   g " + (last.gamma === null ? "-" : Math.round(last.gamma)) + "\n" +
      "vp " + window.innerWidth + "x" + window.innerHeight +
      "   sensor " + (sensorLive ? "on" : "off");
  }

  function currentPose(){
    return sensorLive ? pose : (manualDown ? "down" : "up");
  }

  // How much WE have to rotate. If the browser already turned the page
  // (rotation unlocked), it has done the work and we leave it alone.
  // If it is locked, the viewport stays portrait and we rotate instead.
  function computeR(p){
    var a = POSE[p];
    var vpLandscape = window.innerWidth > window.innerHeight;
    var poseLandscape = (a === 90 || a === 270);
    if (vpLandscape && poseLandscape) return 0;
    return (360 - a) % 360;
  }

  var prevSwap = null;

  function layout(){
    var p = currentPose();
    board.dataset.pose = p;
    R = computeR(p);

    var cs = getComputedStyle(stage);
    var padL = parseFloat(cs.paddingLeft);
    var padT = parseFloat(cs.paddingTop);
    var cw = stage.clientWidth  - padL - parseFloat(cs.paddingRight);
    var ch = stage.clientHeight - padT - parseFloat(cs.paddingBottom);

    var swap = (R === 90 || R === 270);
    var shapeChanged = (prevSwap !== null && prevSwap !== swap);
    prevSwap = swap;

    board.style.transition = shapeChanged ? "none" : "";
    board.style.left   = padL + "px";
    board.style.top    = padT + "px";
    board.style.width  = (swap ? ch : cw) + "px";
    board.style.height = (swap ? cw : ch) + "px";

    if (R === 90)       board.style.transform = "translateX(" + cw + "px) rotate(90deg)";
    else if (R === 180) board.style.transform = "translate(" + cw + "px," + ch + "px) rotate(180deg)";
    else if (R === 270) board.style.transform = "translateY(" + ch + "px) rotate(-90deg)";
    else                board.style.transform = "none";

    updateDebug();
  }

  window.addEventListener("resize", layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  setTimeout(layout, 300);
  window.addEventListener("orientationchange", function(){ setTimeout(layout, 120); });

  // --- gravity ----------------------------------------------------------
  function angleGap(a, b){ return Math.abs(((a - b + 540) % 360) - 180); }

  function onOrient(e){
    if (e.beta === null || e.gamma === null) return;

    var b = e.beta  * Math.PI / 180;
    var g = e.gamma * Math.PI / 180;

    // In-plane gravity, in device axes.
    var gx =  Math.cos(b) * Math.sin(g);
    var gy = -Math.sin(b);

    if (Math.hypot(gx, gy) < 0.3) return;   // lying flat: hold the last pose

    last.beta = e.beta; last.gamma = e.gamma;

    if (!sensorLive){
      sensorLive = true;
      flipBtn.hidden = true;
    }

    var deg = Math.atan2(gx, -gy) * 180 / Math.PI;
    if (deg < 0) deg += 360;

    last.theta = deg;
    if (DEBUG && Date.now() - dbgAt > 200){ dbgAt = Date.now(); updateDebug(); }

    if (angleGap(deg, POSE[pose]) < 60) return;   // dead zone

    var best = pose, bestGap = 999;
    for (var k in POSE){
      var gap = angleGap(deg, POSE[k]);
      if (gap < bestGap){ bestGap = gap; best = k; }
    }
    if (best !== pose){ pose = best; layout(); }
  }

  function needsPermission(){
    return typeof DeviceOrientationEvent !== "undefined" &&
           typeof DeviceOrientationEvent.requestPermission === "function";
  }
  function listen(){ window.addEventListener("deviceorientation", onOrient); }

  function fallbackToManual(){
    flipBtn.textContent = "Flip";
    manualDown = !manualDown;
    layout();
  }

  flipBtn.addEventListener("click", function(){
    if (needsPermission()){
      DeviceOrientationEvent.requestPermission().then(function(state){
        if (state === "granted") listen(); else fallbackToManual();
      }).catch(fallbackToManual);
    } else {
      fallbackToManual();
    }
  });

  if (typeof DeviceOrientationEvent !== "undefined" && !needsPermission()) listen();

  // --- scoring ----------------------------------------------------------
  function render(side){
    var node = el[side];
    node.textContent = scores[side];
    node.classList.remove("bump");
    void node.offsetWidth;
    node.classList.add("bump");
  }

  function change(side, delta){
    var next = Math.min(MAX, Math.max(MIN, scores[side] + delta));
    if (next === scores[side]) return;
    scores[side] = next;
    render(side);
  }

  var origin = null;

  document.querySelectorAll(".panel").forEach(function(panel){
    var side = panel.dataset.side;

    panel.addEventListener("pointerdown", function(e){
      origin = { x: e.clientX, y: e.clientY, id: e.pointerId };
      panel.setPointerCapture(e.pointerId);
      keepAwake();
    });

    panel.addEventListener("pointerup", function(e){
      if (!origin || origin.id !== e.pointerId) return;
      var dx = e.clientX - origin.x;
      var dy = e.clientY - origin.y;
      origin = null;

      // Pointer deltas are in viewport space; turn them into board space
      // so "up" always means what the person looking at it sees as up.
      var rad = -R * Math.PI / 180;
      var lx = dx * Math.cos(rad) - dy * Math.sin(rad);
      var ly = dx * Math.sin(rad) + dy * Math.cos(rad);

      if (Math.abs(ly) < SWIPE || Math.abs(ly) <= Math.abs(lx)) return;
      change(side, ly < 0 ? 1 : -1);
    });

    panel.addEventListener("pointercancel", function(){ origin = null; });
  });

  // --- hold to reset ----------------------------------------------------
  var resetBtn = document.getElementById("reset");
  var holdTimer = null;

  function endHold(){
    clearTimeout(holdTimer);
    holdTimer = null;
    resetBtn.classList.remove("holding");
  }

  resetBtn.addEventListener("pointerdown", function(e){
    e.preventDefault();
    e.stopPropagation();
    resetBtn.classList.add("holding");
    holdTimer = setTimeout(function(){
      scores.left = 0; scores.right = 0;
      render("left"); render("right");
      endHold();
    }, HOLD);
  });

  ["pointerup","pointerleave","pointercancel"].forEach(function(evt){
    resetBtn.addEventListener(evt, endHold);
  });

  // --- keep the screen on -----------------------------------------------
  var lock = null;
  function keepAwake(){
    if (lock || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(function(l){
      lock = l;
      l.addEventListener("release", function(){ lock = null; });
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") keepAwake();
  });

  // --- block browser gestures that fight the swipes ---------------------
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  document.addEventListener("contextmenu",  function(e){ e.preventDefault(); });
  document.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive:false });

  layout();
})();
</script>
</body>
</html>
